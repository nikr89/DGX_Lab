healthCheckTimeout: 1200
logLevel: info
startPort: 10001

macros:
  spark_docker: >
    docker run --rm --name vllm-${MODEL_ID}
    --gpus all --shm-size 8g
    -v ${env.HOME}/.cache/huggingface:/root/.cache/huggingface
    -v ${env.HOME}/.cache/vllm:/root/.cache/vllm
    -e FLASHINFER_DISABLE_VERSION_CHECK=1
    -e CUTE_DSL_ARCH=sm_121a
    -e VLLM_MARLIN_USE_ATOMIC_ADD=1
    -e HF_HUB_OFFLINE=1
    -p ${PORT}:8000
    vllm/vllm-openai:nightly

models:
  gemma4-26b:
    aliases: ["fast"]
    cmd: |
      ${spark_docker}
      unsloth/gemma-4-26B-A4B-it-NVFP4
      --served-model-name fast gemma4-26b
      --max-model-len 262144 --max-num-seqs 8
      --gpu-memory-utilization 0.88
      --enable-prefix-caching
      --enable-auto-tool-choice --tool-call-parser gemma4
      --reasoning-parser gemma4
      --trust-remote-code
    cmdStop: docker stop vllm-${MODEL_ID}
    checkEndpoint: /health
    ttl: 1800

  qwen35-122b:
    aliases: ["smart"]
    cmd: |
      ${spark_docker}
      nvidia/Qwen3.5-122B-A10B-NVFP4
      --served-model-name smart qwen35-122b
      --quantization modelopt --kv-cache-dtype fp8
      --attention-backend flashinfer --moe-backend marlin
      --max-model-len 131072 --max-num-seqs 2
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.85
      --enable-auto-tool-choice --tool-call-parser hermes
      --reasoning-parser qwen3 --trust-remote-code
    cmdStop: docker stop vllm-${MODEL_ID}
    checkEndpoint: /health
    ttl: 1800

  qwen36:
    aliases: ["qwen"]
    cmd: |
      ${spark_docker}
      nvidia/Qwen3.6-35B-A3B-NVFP4
      --served-model-name qwen qwen36
      --quantization modelopt --kv-cache-dtype fp8
      --attention-backend flashinfer --moe-backend marlin
      --max-model-len 131072 --max-num-seqs 4
      --kv-cache-memory 8589934592
      --enable-auto-tool-choice --tool-call-parser hermes
      --reasoning-parser qwen3 --trust-remote-code
    cmdStop: docker stop vllm-${MODEL_ID}
    checkEndpoint: /health
    ttl: 0

  laguna-s21:
    aliases: ["laguna"]
    cmd: |
      ${spark_docker}
      poolside/Laguna-S-2.1-NVFP4
      --served-model-name laguna laguna-s21
      --max-model-len 131072 --max-num-seqs 4
      --gpu-memory-utilization 0.88
      --enable-auto-tool-choice --tool-call-parser poolside_v1
      --reasoning-parser poolside_v1
      --override-generation-config '{"temperature":0.7,"top_p":0.95}'
      --trust-remote-code
    cmdStop: docker stop vllm-${MODEL_ID}
    checkEndpoint: /health
    ttl: 1800

  coder-next:
    aliases: ["code"]
    cmd: |
      ${spark_docker}
      Qwen/Qwen3-Coder-Next-FP8
      --served-model-name code coder-next
      --quantization fp8 --kv-cache-dtype fp8
      --attention-backend flashinfer
      --max-model-len 262144 --max-num-seqs 4
      --gpu-memory-utilization 0.88
      --enable-auto-tool-choice --tool-call-parser qwen3_xml
      --trust-remote-code
    cmdStop: docker stop vllm-${MODEL_ID}
    checkEndpoint: /health
    ttl: 1800

hooks:
  on_startup:
    preload:
      - qwen36
